# Netlify build for the admin / staff website (the Expo app and Supabase SQL are not deployed here).
#
# Required environment variables — set them in Netlify:
#   Site configuration → Environment variables
#     VITE_SUPABASE_URL       = https://<project-ref>.supabase.co
#     VITE_SUPABASE_ANON_KEY  = the anon / publishable key (never the service_role key)
# Then trigger a new deploy: the values are baked in at build time.

[build]
  base = "admin"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path is handled by index.html (e.g. /employees/123, /payslips/abc).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
